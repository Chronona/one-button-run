name: Daily Game Auto-Improvement

on:
  schedule:
    # 毎朝 06:00 JST（UTC 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-improve
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: /usr/local/bin/godot
          key: godot-4.7-stable-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -rf /tmp/godot /tmp/godot.zip
          godot --version

      - name: Make check script executable
        run: chmod +x scripts/check.sh

      - name: Set OpenCode free model config
        run: |
          {
            echo "OPENCODE_CONFIG_CONTENT<<EOF"
            cat .opencode/opencode.jsonc
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 実行前の OPEN PR を控える
        # この実行でできた PR を後で特定するため、実行前の OPEN PR を控える。
        # 開いたままの古い PR（赤のまま放置されたもの）があっても取り違えないため、
        # 作成時刻ではなく差分で「今回できた PR」を判定する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number --jq '[.[].number]' \
            > "$RUNNER_TEMP/open_prs_before.json"

      - name: Run OpenCode improvement
        uses: dceoy/opencode-action@0ff64486494c3134c46df6ce0e51eda4a64e349f # v0.7.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          agent: build
          prompt: |
            You are the build agent for the Godot 4 game "One Button Run" in this repository.

            1. Run `bash scripts/check.sh` to see the current project state. It runs the
               static checks and the L0 contract tests (`scripts/test.sh`). Both must be
               green before you start and after you finish.
            2. Fix any Godot script errors or warnings in main.gd, player.gd, or obstacle.gd.
            3. Make one small, safe improvement: refactor duplicated code, improve variable
               naming, add a minor gameplay tweak, or improve UI/UX feedback. Do not rewrite
               the whole game or change its core one-button mechanic.
            4. Run `bash scripts/check.sh` again. Every contract test must still pass.
            5. Finish; the CI will publish your changes as a pull request. The pull request
               title and description must be written in Japanese.

            Boundaries you must not cross:
            - Never edit `core/**`, `tests/**`, or `.github/workflows/**`. These encode the
              promise that the game stays playable with one button (tap), and CI rejects
              pull requests that change them. Gameplay changes belong in `modes/`.
            - If a contract test fails, fix the game so the contract holds again. Never
              weaken, skip, or delete a test to get to green.
            - Audio changes, if any, must go through earshot, not through
              hand-edited WAVs: edit `audio/earshot-manifest.json` only (see
              `docs/audio-earshot.md`), and regenerate with
              `scripts/generate-audio.py`. Never commit a WAV you did not
              generate from the manifest.
            - The active mode's spec (`modes/registry.json` -> `active` -> `spec`, by
              default `modes/runner/spec.json`) holds the tunable thresholds. Adjusting a
              value there is allowed only when the game genuinely changed for the better;
              say so explicitly in the pull request description.
            - `tests/golden/<mode>.json` records the difficulty curve. You cannot update it,
              and you must not try to. If `test_difficulty_curve` fails, your change altered
              how the game feels. That is not automatically wrong, but it is not a small safe
              improvement either: revert the tweak and pick a different improvement instead.
              Say in the pull request description if you hit this, so a human can decide
              whether the curve should be re-recorded.
          use-github-token: true
          timeout-minutes: 30

      - name: 生成結果を独立に検証
        run: |
          set -euo pipefail
          # GITHUB_TOKEN が作った PR の CI は approval-required 状態で止まるため
          # （GitHub の仕様。人が「Approve workflows to run」を押すまで走らない）、
          # エージェントの自己申告だけが残る状態になりうる。ここで同じ検査を
          # ワークフロー自身が回して、失敗ならこの実行を赤にする。
          godot --headless --path . --import
          bash scripts/check.sh

      - name: 保護対象に触れていないことを確認
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed="$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only origin/main HEAD)"
          echo "変更ファイル:"
          echo "$changed"
          protected="$(echo "$changed" | grep -E '^(core/|tests/|\.github/workflows/)' || true)"
          if [ -n "$protected" ]; then
            echo "::error::保護対象が変更されています（ゲームプレイの変更は modes/ 配下で行ってください）:"
            echo "$protected"
            exit 1
          fi
          echo "OK: 保護対象への変更はありません。"

      - name: 今回できた PR を探す
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found="$(gh pr list --state open --json number,headRefName \
            | jq -r --slurpfile before "$RUNNER_TEMP/open_prs_before.json" \
                'map(select(.number as $n | ($before[0] | index($n)) == null))
                 | sort_by(.number) | last | select(. != null) | "\(.number) \(.headRefName)"')"
          if [ -z "$found" ]; then
            echo "::error::自動フローが作った PR が見つかりません（この実行では何もマージしません）"
            exit 1
          fi
          echo "number=${found%% *}" >> "$GITHUB_OUTPUT"
          echo "head=${found##* }" >> "$GITHUB_OUTPUT"
          echo "PR: $found"

      - name: PR の CI を承認する
        # GITHUB_TOKEN が作った PR の CI は approval-required 状態で止まる
        # （GitHub の仕様。人が「Approve workflows to run」を押すまで走らない）。
        # ここで承認しないと CI が一度も走らないため、自動マージの判断材料が
        # 永久に「なし」のままになる。PAT はこのステップとマージのステップだけに
        # 置き、エージェントの実行環境には渡さない。
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          sha="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          # run が登録されるまで少し時間がかかるので、見つからないときは待って繰り返す。
          for _ in $(seq 1 12); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$HEAD" \
              --jq "[.workflow_runs[]
                     | select(.head_sha == \"$sha\")
                     | select(.conclusion == \"action_required\" or .status == \"action_required\")]
                    | first | .id // empty" || true)"
            if [ -n "$run_id" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              echo "承認しました: run $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::承認待ちの CI 実行が見つかりませんでした（CI が自動で走っている場合はそのまま進みます）"

      - name: CI が緑になるまで待ち、マージする
        # マージの判断基準は PR の CI だけにする。上のステップは補助ではなく、
        # CI を「動かさないと判定できない」状態から解放するためだけにある。
        # PAT でマージするのは、GITHUB_TOKEN でマージすると main への push で
        # ワークフローが起動せず（CI も Pages の公開も動かない）ため。
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            if gh pr checks "$PR" --json name >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          # 待ち続けて止まると実行時間が上限までふやけるので、30分で打ち切る。
          # Ubuntu ランナーには GNU timeout が入っている。
          timeout 1800 gh pr checks "$PR" --watch --fail-fast --interval 30
          gh pr merge "$PR" --squash
