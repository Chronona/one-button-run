name: Daily Game Auto-Improvement

on:
  schedule:
    # 毎朝 06:00 JST（UTC 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-improve
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: /usr/local/bin/godot
          key: godot-4.4-stable-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -rf /tmp/godot /tmp/godot.zip
          godot --version

      - name: Make check script executable
        run: chmod +x scripts/check.sh

      - name: Set OpenCode free model config
        run: |
          {
            echo "OPENCODE_CONFIG_CONTENT<<EOF"
            cat .opencode/opencode.jsonc
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode improvement
        uses: dceoy/opencode-action@0ff64486494c3134c46df6ce0e51eda4a64e349f # v0.7.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          agent: build
          prompt: |
            You are the build agent for the Godot 4 game "One Button Run" in this repository.

            1. Run `bash scripts/check.sh` to see the current project state.
            2. Fix any Godot script errors or warnings in main.gd, player.gd, or obstacle.gd.
            3. Make one small, safe improvement: refactor duplicated code, improve variable naming, add a minor gameplay tweak, or improve UI/UX feedback. Do not rewrite the whole game or change its core one-button mechanic.
            4. Run the check again to confirm no new errors were introduced.
            5. Finish; the CI will publish your changes as a pull request.
          use-github-token: true
          timeout-minutes: 30
