name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot templates
        run: |
          set -euo pipefail
          ls "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/" | head -20

      - name: Create build directory
        run: |
          set -euo pipefail
          mkdir -p build/web

      - name: Export project
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Web"

      - name: Create .nojekyll file
        run: |
          set -euo pipefail
          touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
