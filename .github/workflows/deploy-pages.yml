name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          set -euo pipefail
          # イメージはテンプレートを /root 配下に置くが、Actions はコンテナの
          # HOME を /github/home に差し替えるため Godot が見つけられない。
          mkdir -p "$HOME/.local/share/godot"
          ln -sfn /root/.local/share/godot/export_templates \
            "$HOME/.local/share/godot/export_templates"

          # godot --version は "4.7.stable.official.5b4e0cb0f" のような形式で、
          # ".official" 以降を落とした部分がテンプレートのディレクトリ名になる。
          version="$(godot --version | sed -E 's/\.(official|custom_build).*$//')"
          templates="$HOME/.local/share/godot/export_templates/$version"
          echo "Godot: $version"

          # Web プリセットは thread_support=false のため web_nothreads_* を使う。
          ls "$templates" | grep '^web_nothreads' || {
            echo "::error::Web export templates are missing in $templates"
            exit 1
          }

      - name: Export project
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web"

      - name: Create .nojekyll file
        run: |
          set -euo pipefail
          touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
