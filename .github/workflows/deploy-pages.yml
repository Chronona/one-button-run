name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Godot version and export templates
        run: |
          set -euo pipefail
          # godot --version は "4.7.2.stable.official.ed1daf0bf" のような形式。
          # エクスポートテンプレートのディレクトリ名は ".official" 以降を落とした部分と一致する。
          version="$(godot --version | sed -E 's/\.(official|custom_build).*$//')"
          templates_root="/root/.local/share/godot/export_templates"
          echo "Godot: $version"
          ls "$templates_root" || true

          if [ ! -d "$templates_root/$version" ]; then
            echo "::error::No export templates for $version in $templates_root"
            exit 1
          fi

          # Web プリセットは thread_support=false のため web_nothreads_* を使う。
          ls "$templates_root/$version" | grep '^web' || {
            echo "::error::Web export templates are missing"
            exit 1
          }

      - name: Export project
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web"

      - name: Create .nojekyll file
        run: |
          set -euo pipefail
          touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
