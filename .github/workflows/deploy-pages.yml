name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7
  GODOT_STATUS: stable

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          ls -lh /tmp/godot.zip

      - name: Extract Godot
        run: |
          unzip -o /tmp/godot.zip -d /tmp/godot
          ls -lh /tmp/godot/

      - name: Install Godot binary
        run: |
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          which godot
          ls -lh /usr/local/bin/godot

      - name: Check Godot version
        run: |
          GODOT_FULL_VERSION=$(godot --headless --version | grep -oP '^Godot Engine v\K[^ ]+' | sed 's/\.official.*//')
          echo "Godot version: $GODOT_FULL_VERSION"
          echo "GODOT_FULL_VERSION=$GODOT_FULL_VERSION" >> "$GITHUB_ENV"

      - name: Download export templates
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          echo "Downloaded templates.tpz size: $(stat -c%s /tmp/templates.tpz) bytes"

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_FULL_VERSION}"
          unzip -o /tmp/templates.tpz -d /tmp/godot-templates
          echo "Extracted template files:"
          find /tmp/godot-templates/templates -maxdepth 1 -type f | head -30
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_FULL_VERSION}/"
          # 4.7.0.stable など patch-zero でも検索する可能性があるため symlink で保険をかける
          if [ "${GODOT_FULL_VERSION}" != "${GODOT_VERSION}.0.${GODOT_STATUS}" ]; then
            ln -sfn "$HOME/.local/share/godot/export_templates/${GODOT_FULL_VERSION}" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.0.${GODOT_STATUS}"
          fi
          echo "Installed templates:"
          ls "$HOME/.local/share/godot/export_templates/"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_FULL_VERSION}/" | head -30
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_FULL_VERSION}/web_nothreads_release.zip"

      - name: Create build directory
        run: |
          mkdir -p build/web

      - name: Import assets
        run: |
          godot --headless --path . --import --quit

      - name: Export project
        run: |
          godot --headless -v --path . --export-release "Web" build/web/index.html

      - name: Create .nojekyll file
        run: |
          touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4