name: CI

on:
  pull_request:
  # main への push でも走らせる。ブランチ保護の
  # "Require branches to be up to date before merging" は無効なので、
  # PR のチェックが古いコミットの上で緑だった場合を拾えるのはこちらだけ。
  # （意味的コンフリクトの唯一の検知口なので、外すならまず保護設定を変える）
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: L0 契約テスト
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # エクスポート系は PR のときだけ。main への push では deploy-pages.yml が
      # 同じコミットを本番エクスポートするため、壊れていればそちらが落ちる。
      - name: Set up export templates
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # イメージはテンプレートを /root 配下に置くが、Actions はコンテナの
          # HOME を /github/home に差し替えるため Godot が見つけられない。
          # godot を一度でも起動すると HOME 配下に export_templates が実ディレクトリ
          # として作られ、ln がその中にリンクを入れ子にしてしまう。順序に依存しない
          # よう、張り直す前に必ず消す。
          rm -rf "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.local/share/godot"
          ln -sfn /root/.local/share/godot/export_templates \
            "$HOME/.local/share/godot/export_templates"

          # godot --version は "4.7.stable.official.5b4e0cb0f" のような形式で、
          # ".official" 以降を落とした部分がテンプレートのディレクトリ名になる。
          version="$(godot --version | sed -E 's/\.(official|custom_build).*$//')"
          templates="$HOME/.local/share/godot/export_templates/$version"
          echo "Godot: $version"

          # Web プリセットは thread_support=false のため web_nothreads_* を使う。
          ls "$templates" | grep '^web_nothreads' || {
            echo "::error::Web export templates are missing in $templates"
            exit 1
          }

      - name: Import assets
        run: |
          set -euo pipefail
          # 初回インポートを先に完走させておかないと、リソースの解決が通らない。
          godot --headless --path . --import

      # check.sh は末尾で test.sh を呼ぶので、契約テストを別ステップで先に
      # 走らせると二重実行になる。開発者が手元で叩くのと同じ1本にそろえる。
      - name: 静的チェックと契約テスト
        run: |
          set -euo pipefail
          chmod +x scripts/check.sh scripts/test.sh
          bash scripts/check.sh

      - name: Web エクスポートが通ることを確認
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # deploy-pages.yml と同じ手順。main にマージしてから公開が壊れていた、を防ぐ。
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

  guard:
    name: 契約テスト改変ガード
    # このジョブはブランチ保護の必須チェックに指定してあるため、全 PR で必ず
    # 起動させる。ジョブレベルの if でスキップすると結論が skipped になり、
    # マージ可否が「必須チェックが skipped のときどう扱われるか」という
    # GitHub 側の解釈に依存してしまう。対象ブランチの判定はステップ内で行い、
    # 対象外なら成功として抜けることで、チェックは常に緑を報告する。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # 対象外の PR では履歴の全取得を省く（fetch-depth: 0 は重い）。
      - name: Checkout
        if: startsWith(github.head_ref, 'opencode/')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: core と契約テストが変更されていないこと
        # ブランチ名は外部から与えられる文字列なので、run に直接展開せず
        # 環境変数で受ける。
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 自動フロー（日次の auto-improve と週次の weekly-update）の PR だけを
          # 対象にする。人間は契約そのものを変更してよい。
          case "$HEAD_REF" in
            opencode/*) ;;
            *)
              echo "OK: 自動フロー以外の PR のため対象外（保護対象の変更を許可）。"
              exit 0
              ;;
          esac

          # checkout が fetch-depth: 0 で完全な履歴を取っているので、ここで
          # 追加の fetch は不要。--depth=1 を付けると既存の履歴が切り落とされて
          # shallow になり、PR ブランチが base より遅れている場合に
          # "no merge base" で落ちる。
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "変更ファイル:"
          echo "$changed"
          protected="$(echo "$changed" | grep -E '^(core/|tests/|\.github/workflows/)' || true)"
          if [ -n "$protected" ]; then
            echo "::error::自動改善フローは core・契約テスト・CI 定義を変更できません（ゲームプレイの変更は modes/ 配下で行ってください）:"
            echo "$protected"
            exit 1
          fi
          echo "OK: 保護対象への変更はありません。"
